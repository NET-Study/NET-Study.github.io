<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — NET Study</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<style>
  .nf{min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 24px}
  .nf-inner{max-width:520px}
  .nf img{width:104px; margin:0 auto 28px; border-radius:24%; box-shadow:0 24px 50px -18px rgba(0,0,0,.7)}
  .nf h1{font-size:clamp(2.2rem,6vw,3.4rem); margin-bottom:16px}
  .nf p{color:var(--text-soft); margin:0 0 30px}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="nf">
  <div class="nf-inner">
    <img src="assets/icon-256.png" alt="">
    <p class="eyebrow">404</p>
    <h1>This page has wandered off</h1>
    <p>The verse you were looking for is not here. Let us take you back to the beginning.</p>
    <a class="btn btn-primary" href="/">Back to NET Study</a>
  </div>
</main>
<script>
  (function(){
    var t=null; try{t=localStorage.getItem('netstudy-theme')}catch(e){}
    if(t){document.documentElement.dataset.theme=t}
    else if(matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.dataset.theme='light'}
  })();
</script>
</body>
</html>
